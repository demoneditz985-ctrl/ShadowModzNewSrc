// SHADOW MODZ - application module
// (the "namespace" below is the modern replacement for package="..." in the
//  manifest, which AGP 8 rejects)
apply plugin: 'com.android.application'

// NDK used for ndk-build (libshadowmodz.so). Keep this in sync with the NDK the CI
// workflow installs - it can be overridden without editing this file, e.g.
//   SHADOWMODZ_NDK_VERSION=26.1.10909125 ./gradlew assembleDebug
def shadowNdkVersion = System.getenv('SHADOWMODZ_NDK_VERSION') ?: '25.2.9519653'

android {
    // must match package com.shadowmodz.support at the top of the Java sources,
    // otherwise the generated R / BuildConfig land in a package those files
    // cannot see ("package R does not exist")
    namespace 'com.shadowmodz.support'
    compileSdk 34
    ndkVersion shadowNdkVersion

    defaultConfig {
        applicationId "com.shadowmodz"
        minSdk 21                 // matches Application.mk APP_PLATFORM := android-21
        targetSdk 33
        versionCode 7
        versionName "5.2"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        signingConfig signingConfigs.debug
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    // keep the payload as a real .so on disk: the injector copies it out of
    // nativeLibraryDir with plain file I/O, so the .so files must be extracted
    // from the APK at install time (this is extractNativeLibs=true, the AGP 8
    // way of saying it)
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// AIDE used to need dependencies below the android {} block - harmless to keep
dependencies {
    // optional: drop libsu / any helper jar in here (not required anymore,
    // see java/com/shadowmodz/support/RootShell.java)
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
