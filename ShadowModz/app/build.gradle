// SHADOW MODZ - application module
// (the "namespace" below is the modern replacement for package="..." in the
//  manifest, which AGP 8 rejects)
apply plugin: 'com.android.application'

android {
    namespace 'com.shadowmodz'
    compileSdk 34

    defaultConfig {
        applicationId "com.shadowmodz"
        minSdk 21                 // matches Application.mk APP_PLATFORM := android-21
        targetSdk 33
        versionCode 4
        versionName "4.0"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        signingConfig signingConfigs.debug
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    // keep the payload as a real .so on disk: the injector copies it from
    // nativeLibraryDir, so it must be extracted from the APK
    // (also set as android:extractNativeLibs in the manifest)

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// AIDE used to need dependencies below the android {} block - harmless to keep
dependencies {
    // optional: drop libsu / any helper jar in here (not required anymore,
    // see java/com/shadowmodz/support/RootShell.java)
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
