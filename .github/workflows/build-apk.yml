name: Build SHADOW MODZ APK

# GitHub runners have the full JDK + Android SDK + NDK, which is exactly what
# the authoring sandbox is missing. Every push builds a fresh, installable APK
# and a prebuilt libmasgik.so for both ABIs.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: '8.2'      # must stay >= the AGP version in ShadowModz/build.gradle
  NDK_VERSION: '25.2.9519653' # r25b - ndk-build, supports android-21, both ABIs
  API_LEVEL: '34'

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          build-root-directory: ShadowModz

      - name: Install Android SDK packages (NDK + platform)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)"
          if [ ! -x "${SDKMANAGER:-}" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-${API_LEVEL}" \
            "build-tools;${API_LEVEL}.0.0" \
            "ndk;${NDK_VERSION}" \
            "platform-tools" 2>&1 | tail -15
          ls "$SDK/ndk"

      - name: Generate the Gradle wrapper
        # The wrapper jar is a binary the authoring sandbox could not produce
        # (no local Gradle). Generate it here so the repo ships a working
        # ./gradlew and Android Studio syncs without doing it for you.
        working-directory: ShadowModz
        run: gradle wrapper --gradle-version "$GRADLE_VERSION"

      - name: Build debug APK (debug-signed, installs as-is)
        working-directory: ShadowModz
        env:
          SHADOWMODZ_NDK_VERSION: ${{ env.NDK_VERSION }}
        run: gradle assembleDebug --stacktrace

      - name: Build summary
        if: always()
        working-directory: ShadowModz
        run: |
          echo "### SHADOW MODZ build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -d app/build/outputs/apk ]; then
            find app/build/outputs/apk -name '*.apk' -printf '%p  %k KB\n' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          find app/build/intermediates -name 'libmasgik.so' -printf '%p  %k KB\n' 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shadowmodz-apk
          path: ShadowModz/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload the payload .so files (both ABIs)
        uses: actions/upload-artifact@v4
        with:
          name: libmasgik-so
          path: ShadowModz/app/build/intermediates/ndkBuild/**/obj/**/libmasgik.so
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the Gradle wrapper files
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            ShadowModz/gradle/wrapper/gradle-wrapper.jar
            ShadowModz/gradlew
            ShadowModz/gradlew.bat
          if-no-files-found: warn
          retention-days: 90

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ShadowModz/**/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 7
