name: Build SHADOW MODZ APK

# GitHub runners have the full JDK + Android SDK + NDK, which is exactly what
# the authoring sandbox is missing. Every push builds a fresh, installable APK
# plus libmasgik.so for both ABIs.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Also publish a GitHub Release with the APK'
        type: boolean
        default: false

permissions:
  contents: write

env:
  GRADLE_VERSION: '8.2'       # must be >= the AGP version in ShadowModz/build.gradle
  NDK_VERSION: '25.2.9519653' # r25b - ndk-build, android-21, both ABIs
  API_LEVEL: '34'
  RELEASE_TAG: 'v4.0'         # keep in sync with versionName in app/build.gradle

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Android SDK packages (NDK + platform)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)"
          if [ ! -x "${SDKMANAGER:-}" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-${API_LEVEL}" \
            "build-tools;${API_LEVEL}.0.0" \
            "ndk;${NDK_VERSION}" \
            "platform-tools" 2>&1 | tail -15
          echo "installed NDKs:"; ls "$SDK/ndk"

      - name: Generate the Gradle wrapper
        # The wrapper jar is a binary the authoring sandbox could not produce
        # (no local Gradle). Generate it here so the repo ships a working
        # ./gradlew and Android Studio syncs without generating it for you.
        working-directory: ShadowModz
        run: gradle wrapper --gradle-version "$GRADLE_VERSION"

      - name: Build debug APK (debug-signed, installs as-is)
        working-directory: ShadowModz
        env:
          SHADOWMODZ_NDK_VERSION: ${{ env.NDK_VERSION }}
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Publish the log (annotations + commit comment, both API-readable)
        if: failure()
        working-directory: ShadowModz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error title=Build failed::see the commit comment on $GITHUB_SHA"
          tail -c 3000 build.log
          python3 - "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SERVER_URL" <<'PY' > /tmp/comment.json
          import json, os, sys
          repo, sha, server = sys.argv[1], sys.argv[2], sys.argv[3]
          log = open('build.log', encoding='utf-8', errors='replace').read()
          tail = log[-55000:]
          body = ("### Build failed\n\n"
                  "`%s` on %s\n\n```\n%s\n```" % (sha[:12], os.environ.get('GITHUB_REF', ''), tail))
          print(json.dumps({"body": body}))
          PY
          curl -sS -o /dev/null -w "commit comment: HTTP %{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/comment.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments"

      - name: Build summary
        if: always()
        working-directory: ShadowModz
        run: |
          {
            echo "### SHADOW MODZ build"
            echo
            if [ -d app/build/outputs/apk ]; then
              find app/build/outputs/apk -name '*.apk' -printf '%p  %k KB\n'
            else
              echo 'no APK produced'
            fi
            echo
            find app/build/intermediates -name 'libmasgik.so' -printf '%p  %k KB\n' 2>/dev/null || true
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shadowmodz-apk
          path: ShadowModz/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload the payload .so files (both ABIs)
        uses: actions/upload-artifact@v4
        with:
          name: libmasgik-so
          path: ShadowModz/app/build/intermediates/ndkBuild/**/obj/**/libmasgik.so
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the Gradle wrapper files
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            ShadowModz/gradle/wrapper/gradle-wrapper.jar
            ShadowModz/gradlew
            ShadowModz/gradlew.bat
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ShadowModz/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish a GitHub Release with the APK
        if: success() && (startsWith(github.ref, 'refs/tags/v') || inputs.create_release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Debug-signed SHADOW MODZ build (\`$(date -u +%Y-%m-%d)\`, run $GITHUB_RUN_NUMBER).
          Activation key: \`SHADOWMODZ\`. Root required; needs the injector libs in
          \`app/src/main/jniLibs/<abi>/\` to actually inject."
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --title "SHADOW MODZ $RELEASE_TAG" \
                 --notes "$NOTES" --target "$GITHUB_SHA" --prerelease
          gh release upload "$RELEASE_TAG" ShadowModz/app/build/outputs/apk/debug/*.apk --clobber
          echo "release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
